server {
    listen 80;
    listen [::]:80;
    server_name mac.faizal.uk;
    root /home/ubuntu/MacOS-Production;
    index index.html;

    # -------------------------------------------------------
    # 1. Vite-hashed bundles: /assets/*.js, /assets/*.css etc.
    #    Served DIRECTLY from disk — never proxied to Node.
    # -------------------------------------------------------
    location ~* ^/assets/ {
        try_files $uri @node_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";

        # Ensure correct MIME types
        types {
            application/javascript  js mjs;
            text/css                css;
            image/svg+xml           svg svgz;
            image/webp              webp;
            image/png               png;
            image/jpeg              jpg jpeg;
        }
    }

    # -------------------------------------------------------
    # 2. Static frontend module files (/frontend/...)
    #    Served DIRECTLY from disk.
    # -------------------------------------------------------
    location ~* ^/frontend/ {
        try_files $uri @node_frontend;
        add_header X-Content-Type-Options "nosniff";
    }

    # -------------------------------------------------------
    # 3. Wallpapers (/Assets/Wallpaper/...) → Wallpapers/ dir
    # -------------------------------------------------------
    # Use ^~ to ensure this prefix match takes precedence over the ~* ^/assets/ regex below
    location ^~ /Assets/Wallpaper/ {
        alias /home/ubuntu/MacOS-Production/Wallpapers/;
        try_files $uri @node_frontend;
        expires 7d;
        add_header Cache-Control "public";
    }
    location ^~ /assets/Wallpaper/ {
        alias /home/ubuntu/MacOS-Production/Wallpapers/;
        try_files $uri @node_frontend;
        expires 7d;
        add_header Cache-Control "public";
    }

    # -------------------------------------------------------
    # 4. manifest.json + other root static files
    # -------------------------------------------------------
    location = /manifest.json {
        try_files $uri @node_frontend;
    }

    # -------------------------------------------------------
    # 4b. Synthetic Health Probe for Monitoring (Better Stack)
    # -------------------------------------------------------
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # -------------------------------------------------------
    # 5. Backend API Proxy → Node.js :3001
    # -------------------------------------------------------
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # -------------------------------------------------------
    # 6. Everything else → Frontend Node.js server :3000
    #    No try_files here — proxy_pass handles routing.
    # -------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # Fallback Proxy for Assets Nginx Cannot Read Directly
    # -------------------------------------------------------
    location @node_frontend {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle large file uploads
    client_max_body_size 500M;
}
