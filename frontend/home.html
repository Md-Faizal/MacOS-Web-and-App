  <script>
    // Global Theme & Appearance Bootstrapper
    (function() {
      const getScopedStorageKey = (baseKey) => {
        const userId = window.currentUserData?.id || sessionStorage.getItem('macos_user_id') || localStorage.getItem('macos_active_user_id') || 'guest';
        const safeUserId = String(userId).replace(/[^a-zA-Z0-9_-]/g, '_') || 'guest';
        return `${baseKey}__user_${safeUserId}`;
      };

      const applyResolvedTheme = (rawTheme) => {
        let resolved = rawTheme;
        if (rawTheme === 'auto') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-macos-theme', resolved);
        if (document.body) document.body.setAttribute('data-theme', resolved);
      };

      const cachedTheme = localStorage.getItem(getScopedStorageKey('macos_theme')) || 'auto';
      applyResolvedTheme(cachedTheme);

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const current = localStorage.getItem(getScopedStorageKey('macos_theme')) || 'auto';
        if (current === 'auto') applyResolvedTheme('auto');
      });

      window.addEventListener('macos-theme-changed', (e) => {
        if (e.detail?.theme) {
          applyResolvedTheme(e.detail.theme);
        }
      });

      // Sync with server DB settings
      fetch('/api/settings').then(r => r.json()).then(data => {
        if (data && data.theme) {
          localStorage.setItem(getScopedStorageKey('macos_theme'), data.theme);
          applyResolvedTheme(data.theme);
        }
        if (data) {
          const current = JSON.parse(localStorage.getItem(getScopedStorageKey('settingsAppData')) || '{}');
          const updated = { ...current };
          if (data['dock-magnification'] !== undefined) updated['dock-magnification'] = data['dock-magnification'];
          if (data['dock-auto-hide'] !== undefined) updated['dock-auto-hide'] = data['dock-auto-hide'];
          localStorage.setItem(getScopedStorageKey('settingsAppData'), JSON.stringify(updated));

          if (data.appBarOrder && Array.isArray(data.appBarOrder)) {
            localStorage.setItem('appBarOrder', JSON.stringify(data.appBarOrder));
          }

          window.dispatchEvent(new CustomEvent('dock-settings-changed', {
            detail: {
              'dock-auto-hide': updated['dock-auto-hide'],
              'dock-magnification': updated['dock-magnification'],
              'appBarOrder': data.appBarOrder
            }
          }));
        }
      }).catch(() => {});
    })();
  </script>

  <script>
    // Handle browser extension messages gracefully to suppress "Unchecked runtime.lastError" warnings
    if (window.chrome && window.chrome.runtime && window.chrome.runtime.onMessage) {
      window.chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
        try { sendResponse({}); } catch (e) {}
        return true;
      });
    }

    // Global fetch interceptor to tag platform (PWA vs Web Desktop) for our backend API
    const isPWA = window.matchMedia('(display-mode: standalone)').matches || 
                  window.navigator.standalone === true || 
                  document.referrer.includes('android-app://');
    const nativeFetch = window.fetch;
    window.fetch = function(url, options = {}) {
      try {
        const reqUrl = typeof url === 'string' ? url : (url && url.url ? url.url : '');
        const isRelative = reqUrl.startsWith('/') && !reqUrl.startsWith('//');
        const isSameOrigin = reqUrl.startsWith(window.location.origin);
        
        // Only attach internal tracking header to our own backend/same-origin requests
        if (isRelative || isSameOrigin) {
          const opts = { ...options };
          opts.headers = new Headers(opts.headers || {});
          if (!opts.headers.has('X-Client-Platform')) {
            opts.headers.set('X-Client-Platform', isPWA ? 'pwa' : 'web');
          }
          return nativeFetch.call(this, url, opts);
        }
      } catch (e) {
        // Fall through to native fetch on error
      }
      return nativeFetch.call(this, url, options);
    };

    // Strict Session Guard: Block direct unauthenticated access to home.html
    (async function() {
      const redirectToLogin = () => {
        window.location.replace('index.html');
      };

      try {
        const isSessionActive = sessionStorage.getItem('macos_session_active') === 'true';

        // 1. Session in this tab/browser window must be active
        if (!isSessionActive) {
          console.warn('Unauthorized: No active session. Redirecting to login...');
          redirectToLogin();
          return;
        }

        // 2. Validate session with backend verification endpoint
        const verifyRes = await fetch('/api/auth/verify');
        if (!verifyRes.ok) {
          console.warn('Unauthorized: Session invalid on backend. Redirecting to login...');
          sessionStorage.removeItem('macos_session_active');
          redirectToLogin();
          return;
        }

        const verifyData = await verifyRes.json();
        if (!verifyData.authenticated) {
          sessionStorage.removeItem('macos_session_active');
          redirectToLogin();
          return;
        }

        // 3. Mark session active, store role & permissions snapshot, reveal page content
        window.currentUserData = verifyData.user;
        window.currentUserPermissions = verifyData.permissions;
        sessionStorage.setItem('macos_session_active', 'true');
        sessionStorage.setItem('macos_user_role', verifyData.user?.role || 'owner');
        if (verifyData.user?.id) {
          sessionStorage.setItem('macos_user_id', verifyData.user.id);
        }
        if (Array.isArray(verifyData.permissions?.allowedApps) && verifyData.permissions.allowedApps.length > 0) {
          sessionStorage.setItem('macos_allowed_apps', JSON.stringify(verifyData.permissions.allowedApps));
        } else if (verifyData.user?.role === 'worker') {
          sessionStorage.setItem('macos_allowed_apps', JSON.stringify(['billing', 'products', 'contacts', 'analytics']));
        }
        window.dispatchEvent(new CustomEvent('macos-auth-verified', { detail: verifyData }));
        if (typeof window.initializeDock === 'function') {
          window.initializeDock();
        }
        
        const guardStyle = document.getElementById('auth-guard-style');
        if (guardStyle) guardStyle.remove();

        // 4. Start periodic background session validation & device heartbeat (every 30s)
        let consecutiveAuthFailures = 0;
        setInterval(async () => {
          if (!navigator.onLine) {
            // Offline - do not terminate session due to temporary disconnect
            return;
          }
          try {
            const checkRes = await fetch('/api/auth/verify');
            if (checkRes.status === 401) {
              consecutiveAuthFailures++;
              if (consecutiveAuthFailures >= 2) {
                console.warn('Background session validation failed (terminated remotely or expired), locking screen...');
                sessionStorage.removeItem('macos_session_active');
                alert('Your session has ended or was terminated from another device.');
                window.location.replace('index.html');
              }
              return;
            }
            if (checkRes.ok) {
              consecutiveAuthFailures = 0;
              const data = await checkRes.json();
              if (!data.authenticated) {
                sessionStorage.removeItem('macos_session_active');
                alert('Your session has ended or was terminated from another device.');
                window.location.replace('index.html');
                return;
              }
              if (data.permissions) {
                const prevApps = sessionStorage.getItem('macos_allowed_apps');
                const newApps = JSON.stringify(data.permissions.allowedApps || []);
                window.currentUserPermissions = data.permissions;
                if (Array.isArray(data.permissions.allowedApps) && data.permissions.allowedApps.length > 0 && prevApps !== newApps) {
                  sessionStorage.setItem('macos_allowed_apps', newApps);
                  if (typeof window.initializeDock === 'function') {
                    window.initializeDock();
                  }
                }
              }
            }
          } catch (e) {
            // Transient network error (laptop sleep/wake, Wi-Fi reconnection, packet drop)
            // Silently log and wait for next interval instead of prematurely logging user out!
            console.warn('Session verification background check temporarily unreachable:', e.message);
          }
        }, 30000); // 30 seconds
      } catch (err) {
        console.error('Session verification error:', err);
        redirectToLogin();
      }
    })();

    // Handle browser extension messages gracefully to suppress "Unchecked runtime.lastError" warnings
    if (window.chrome && window.chrome.runtime) {
      window.chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
        // Silently ignore messages from extensions
        try {
          sendResponse({});
        } catch (e) {
          // Port might be closed, ignore
        }
        return true; // Keep the message channel open
      });
    }
  </script>

  <style>
    /* ===== BASE RESET ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #000;
    }

    body {
      font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: transparent;
    }


    /* ===== WALLPAPER BACKGROUND ===== */
    #wallpaperBackground {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      pointer-events: none;
    }



    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      z-index: 1;
    }

    /* ===== DESKTOP AREA LAYOUT & SCROLLBAR HIDING ===== */
    .desktop-area {
      overflow: auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE and Edge */
      scroll-behavior: smooth;
    }
    .desktop-area::-webkit-scrollbar {
      display: none; /* Chrome, Safari and Opera */
    }

    /* ===== TIME & DATE DISPLAY ===== */
    .time-date-container {
      text-align: center;
      animation: slideInDown 0.8s ease-out;
    }

    .time-display {
      font-size: 4.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .date-info {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .day {
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .date {
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .separator {
      width: 2px;
      height: 1.25rem;
      background: rgba(255, 255, 255, 0.5);
    }

    /* ===== BOTTOM APP BAR (moved to app-bar.css) ===== */

    /* ===== LOGIN PAGE CLOCK ===== */
    /* ===== TOP BAR CONTAINER & LAYOUT ===== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 25;
    }

    .top-bar-left {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
    }

    .top-bar-right {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
    }

    /* AI ASSISTANT BUTTON */
    .ai-assistant-btn {
      background: none;
      border: none;
      padding: 0 !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .ai-assistant-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.1);
    }

    .ai-assistant-btn:active {
      transform: scale(0.95);
    }

    .ai-assistant-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    /* ===== APPLE LOGO - TOP LEFT ===== */
    .apple-logo {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      z-index: 25;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .apple-logo:hover {
      opacity: 0.8;
      transform: scale(1.1);
    }

    .apple-logo svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
    }

    .apple-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
    }

    /* ===== RECENT APP DISPLAY ===== */
    .recent-app-display {
      display: flex;
      align-items: center;
      margin-left: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      max-width: 150px;
    }

    .recent-app-display:hover {
      transform: scale(1.05);
    }

    .recent-app-name {
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ===== TOP RIGHT TIME & WEATHER DISPLAY ===== */
    .top-right-display {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      z-index: 20;
      animation: slideInRight 0.8s ease-out;
    }

    .time-weather-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .time-weather-time {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .time-weather-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .time-weather-day {
      letter-spacing: 0.3px;
    }

    .time-weather-date {
      letter-spacing: 0.3px;
    }

    /* ===== WEATHER DISPLAY IN APP BAR ===== */
    .weather-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .weather-icon-display {
      font-size: 1.2rem;
      display: flex;
      align-items: center;
    }

    .weather-temp-display {
      font-weight: 600;
      min-width: 35px;
    }

    /* ===== QUICK SETTINGS CONTAINER ===== */
    .quick-settings-container {
      display: flex;
      align-items: center;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

        padding: 0 1rem 0.5rem;
        min-height: 95px;

      }

        max-width: 70%;

    /* Optimize for touch devices */

      .app-slot {
        min-width: 54px;
        min-height: 54px;
      }

      .app-bar-item:active {

    /* ===== DESKTOP AREA ===== */
    #desktopArea {

  <script type="module">
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize logo
      const logoDisplay = new LogoDisplay('appleLogo', {
        altText: 'Apple Logo'
      });

      // Initialize clock display using standardized component
      const clockDisplay = new ClockDisplay('loginClockDisplay', {
        format: '12h',
        showComma: false  // "Sun Jan 18 8:03 PM" without comma
      });

      // Initialize weather display
      const weatherDisplay = new WeatherDisplay('loginWeatherDisplay', {
        updateInterval: 600000, // 10 minutes
        useMetricUnits: true
      });

      // Initialize quick settings in top bar
      const quickSettings = new QuickSettings('quickSettingsContainer', {
        iconPath: '/assets/Images/Quick Settings.png',
        label: 'Settings',
        type: 'topbar'
      });

      // Initialize dock with slots and drag-and-drop
      initializeDock();

      // Initialize search functionality
      initializeSearch();
    });


    // Fallback if DOM is already loaded
    if (document.readyState !== 'loading') {
      new LogoDisplay('appleLogo', {
        altText: 'Apple Logo'
      });
      new ClockDisplay('loginClockDisplay', {
        format: '12h',
        showComma: false
      });
      new WeatherDisplay('loginWeatherDisplay', {
        updateInterval: 600000,
        useMetricUnits: true
      });
      
      // Initialize dock with slots and drag-and-drop
      initializeDock();
      
      initializeSearch();
    }

    // ===== SEARCH FUNCTIONALITY =====
    function initializeSearch() {
      const searchButton = document.getElementById('searchButton');
      const searchPanel = document.getElementById('searchPanel');
      const searchInput = document.getElementById('searchInput');
      const closeSearchBtn = document.getElementById('closeSearchBtn');
      const searchResults = document.getElementById('searchResults');

      // Toggle search panel
      searchButton.addEventListener('click', (e) => {
        e.preventDefault();
        searchPanel.classList.toggle('active');
        if (searchPanel.classList.contains('active')) {
          searchInput.focus();
        }
      });

      // Close search panel
      closeSearchBtn.addEventListener('click', () => {
        searchPanel.classList.remove('active');
      });

      // Search input functionality
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        
        if (query.length === 0) {
          searchResults.innerHTML = '';
          return;
        }

        // App and navigation commands
        const searchableItems = [
          // Apps
          { name: 'Calculator', type: 'app', page: 'calculator', icon: '🧮' },
          { name: 'Settings', type: 'app', page: 'settings', icon: '⚙️' },
          { name: 'Billing', type: 'app', page: 'billing', icon: '💰' },
          { name: 'Notes', type: 'app', page: 'notes', icon: '📝' },
          { name: 'Calendar', type: 'app', page: 'calendar', icon: '📅' },
          { name: 'Contacts', type: 'app', page: 'contacts', icon: '👥' },
          { name: 'Analytics', type: 'app', page: 'analytics', icon: '📊' },
          { name: 'Products', type: 'app', page: 'product-list', icon: '🛍️' },
          { name: 'Cloud', type: 'app', page: 'cloud', icon: '☁️' },
          { name: 'Launchpad', type: 'app', page: 'launchpad', icon: '🚀' },
          { name: 'Weather', type: 'app', page: 'weather', icon: '🌤️' },
          { name: 'Clock', type: 'app', page: 'clock-display', icon: '🕐' },
          
          // Pages within apps
          { name: 'Wallpapers', type: 'page', app: 'settings', section: 'wallpaper', icon: '🖼️' },
          { name: 'Customize Wallpaper', type: 'page', app: 'settings', section: 'wallpaper', icon: '🖼️' },
          { name: 'Quick Settings', type: 'page', app: 'settings', section: 'quick-settings', icon: '⚡' },
          { name: 'Billing Ledger', type: 'page', app: 'billing', section: 'ledger', icon: '📋' },
          { name: 'Invoices', type: 'page', app: 'billing', section: 'invoices', icon: '🧾' },
          { name: 'Payments', type: 'page', app: 'billing', section: 'payments', icon: '💳' },
        ];

        const results = searchableItems.filter(item => 
          item.name.toLowerCase().includes(query)
        );

        if (results.length === 0) {
          searchResults.innerHTML = '<div class="search-result-item">No results found</div>';
        } else {
          searchResults.innerHTML = results.map(item => 
            `<div class="search-result-item" data-name="${item.name}" data-type="${item.type}" data-page="${item.page || ''}" data-app="${item.app || ''}" data-section="${item.section || ''}">${item.icon} ${item.name}</div>`
          ).join('');

          // Add click handlers to search results
          document.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', () => {
              const name = item.dataset.name;
              const type = item.dataset.type;
              const page = item.dataset.page;
              const app = item.dataset.app;
              const section = item.dataset.section;

              // Handle app navigation
              if (type === 'app') {
                openApp(page);
              } else if (type === 'page') {
                openApp(app);
                // Navigate to section after a short delay
                setTimeout(() => {
                  navigateToSection(app, section);
                }, 300);
              }

              searchInput.value = '';
              searchPanel.classList.remove('active');
            });
          });
        }
      });

      // Helper function to open app
      function openApp(appName) {
        const appSelector = {
          'calculator': '#calculatorApp',
          'settings': '#settingsApp',
          'billing': '#billingApp',
          'notes': '#notesApp',
          'calendar': '#calendarWindow',
          'contacts': '#contactsApp',
          'analytics': '#analyticsApp',
          'product-list': '#productListApp',
          'launchpad': '#launchpadApp',
          'weather': '[data-app="weather"]',
          'clock-display': '[data-app="clock-display"]'
        };

        const selector = appSelector[appName];
        if (selector) {
          const app = document.querySelector(selector);
          if (app) {
            // Show app if hidden
            if (app.style) app.style.display = 'block';
            if (app.classList) {
              app.classList.remove('hidden');
              app.classList.add('active');
            }
            // Click to activate/open
            if (app.click && app.tagName === 'BUTTON') {
              app.click();
            }
            // Scroll into view
            app.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }

      // Helper function to navigate to section within app
      function navigateToSection(app, section) {
        const sectionSelectors = {
          'wallpaper': '[data-section="wallpaper"], .wallpaper-section',
          'quick-settings': '[data-section="quick-settings"], .quick-settings-section',
          'ledger': '[data-section="ledger"], .ledger-section',
          'invoices': '[data-section="invoices"], .invoices-section',
          'payments': '[data-section="payments"], .payments-section'
        };

        const selector = sectionSelectors[section];
        if (selector) {
          const element = document.querySelector(selector);
          if (element) {
            if (element.click) element.click();
            element.scrollIntoView({ behavior: 'smooth' });
          }
        }
      }

      // Close panel when clicking outside
      document.addEventListener('click', (e) => {
        if (!searchPanel.contains(e.target) && !searchButton.contains(e.target)) {
          searchPanel.classList.remove('active');
        }
      });

      // Close panel with Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          searchPanel.classList.remove('active');
        }
      });
    }
  </script>
