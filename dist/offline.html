<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at 20% 20%, #667eea, #0b1020 60%);
        color: rgba(255,255,255,0.92);
      }
      .card {
        width: min(560px, calc(100vw - 32px));
        padding: 22px 20px;
        border-radius: 14px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.14);
        backdrop-filter: blur(18px);
      }
      h1 { margin: 0 0 8px 0; font-size: 20px; }
      p { margin: 0; line-height: 1.45; opacity: 0.9; }
      .meta { margin-top: 14px; font-size: 12px; opacity: 0.75; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>This page isn’t available right now. Reconnect to the internet (or your local network) and refresh.</p>
      <div class="meta">
        Tip: If you’re running locally, ensure the backend is up and reachable.
      </div>
    </div>
  </body>
</html>
