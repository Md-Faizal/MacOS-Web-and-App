  <script>
    // Strict Session Guard: Block direct unauthenticated access to home.html
    (async function() {
      const redirectToLogin = () => {
        window.location.replace('index.html');
      };

      try {
        const isSessionActive = sessionStorage.getItem('macos_session_active') === 'true';

        // 1. Session in this tab/browser window must be active
        if (!isSessionActive) {
          console.warn('Unauthorized: No active session. Redirecting to login...');
          redirectToLogin();
          return;
        }

        // 2. Validate session with backend verification endpoint
        const verifyRes = await fetch('/api/auth/verify');
        if (!verifyRes.ok) {
          console.warn('Unauthorized: Session invalid on backend. Redirecting to login...');
          sessionStorage.removeItem('macos_session_active');
          redirectToLogin();
          return;
        }

        const verifyData = await verifyRes.json();
        if (!verifyData.authenticated) {
          sessionStorage.removeItem('macos_session_active');
          redirectToLogin();
          return;
        }

        // 3. Mark session active, store role & permissions snapshot, reveal page content
        window.currentUserData = verifyData.user;
        window.currentUserPermissions = verifyData.permissions;
        sessionStorage.setItem('macos_session_active', 'true');
        sessionStorage.setItem('macos_user_role', verifyData.user?.role || 'owner');
        sessionStorage.setItem('macos_allowed_apps', JSON.stringify(verifyData.permissions?.allowedApps || []));
        window.dispatchEvent(new CustomEvent('macos-auth-verified', { detail: verifyData }));
        if (typeof window.initializeDock === 'function') {
          window.initializeDock();
        }
        
        const guardStyle = document.getElementById('auth-guard-style');
        if (guardStyle) guardStyle.remove();

        // 4. Start periodic background session validation & device heartbeat (every 30s)
        setInterval(async () => {
          try {
            const checkRes = await fetch('/api/auth/verify');
            if (!checkRes.ok) throw new Error('Session invalid');
            const data = await checkRes.json();
            if (!data.authenticated) throw new Error('Not authenticated');
          } catch (e) {
            console.warn('Background session validation failed (terminated remotely or expired), locking screen...');
            sessionStorage.removeItem('macos_session_active');
            alert('Your session has ended or was terminated from another device.');
            window.location.replace('index.html');
          }
        }, 30000); // 30 seconds
      } catch (err) {
        console.error('Session verification error:', err);
        redirectToLogin();
      }
    })();

    // Handle browser extension messages gracefully to suppress "Unchecked runtime.lastError" warnings
    if (window.chrome && window.chrome.runtime) {
      window.chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
        // Silently ignore messages from extensions
        try {
          sendResponse({});
        } catch (e) {
          // Port might be closed, ignore
        }
        return true; // Keep the message channel open
      });
    }
