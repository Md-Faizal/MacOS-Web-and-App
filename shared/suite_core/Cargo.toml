[package]
name = "suite_core"
version = "1.0.0"
edition = "2021"
description = "High-performance enterprise calculation engine and domain core for macOS Business Suite"
authors = ["macOS Business Suite Core Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
jni-export = []
wasm-export = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
