name: macos-stack

# Base configuration shared across all container instances
x-macos-base: &macos-base
  image: macos-server:latest
  build:
    context: .
    dockerfile: Dockerfile
  user: "1001:1001"
  restart: unless-stopped
  environment:
    - NODE_ENV=production
    - HOST=0.0.0.0
    - NODE_OPTIONS=--max-old-space-size=400
  env_file:
    - .env
  volumes:
    - ./database:/app/database
    - ./CloudStorage:/app/CloudStorage
    - ./Wallpapers:/app/Wallpapers
    - ./backend/uploads:/app/backend/uploads
    - ./backend:/app/backend
    - ./frontend:/app/frontend
    - ./dist:/app/dist
    - ./logs:/app/logs
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/api/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 45s

services:
  # Blue Instance (Listens on port 3001)
  macos-server-blue:
    <<: *macos-base
    container_name: macos-server-blue
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DOCKER_SLOT=blue
      - NODE_OPTIONS=--max-old-space-size=400

  # Green Instance (Listens on port 3004)
  macos-server-green:
    <<: *macos-base
    container_name: macos-server-green
    ports:
      - "127.0.0.1:3004:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DOCKER_SLOT=green
      - NODE_OPTIONS=--max-old-space-size=400
