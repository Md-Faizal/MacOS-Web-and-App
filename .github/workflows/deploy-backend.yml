name: 🚀 Deploy — Backend & MacOS Frontend

# ──────────────────────────────────────────────────────────────
# Triggers:
#   • Auto: push to main touching backend, frontend, or Docker files
#   • Manual: workflow_dispatch with optional version bump + dry-run
#   • Called: workflow_call from deploy-all.yml
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'tools/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'server-prod.js'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'

  workflow_dispatch:
    inputs:
      bump_version:
        description: 'Auto-bump version before deploy?'
        required: true
        type: choice
        options: ['none', 'patch', 'minor']
        default: 'none'
      dry_run:
        description: 'Dry Run (backup + verify without deploying)'
        required: true
        type: boolean
        default: false
      skip_npm_install:
        description: 'Skip npm install (faster if packages unchanged)'
        required: true
        type: boolean
        default: false

  workflow_call:
    inputs:
      bump_version:
        type: string
        default: 'none'
      dry_run:
        type: boolean
        default: false
      skip_npm_install:
        type: boolean
        default: false
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_KEY:  { required: true }
      SSH_HOST_VM2: { required: false }
      SSH_USER_VM2: { required: false }
      SSH_KEY_VM2:  { required: false }

permissions:
  contents: write

concurrency:
  group: production-vm-deploy
  cancel-in-progress: false

jobs:
  pre-flight-check:
    name: 🛡️ Pre-Flight Verification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        if: ${{ !inputs.skip_npm_install }}
        run: npm ci

      - name: 🔍 Syntax Validation
        run: |
          node --check backend/main/macos-api-server.js
          node --check server-prod.js
          node --check tools/healthcheck.mjs

      - name: 🏗️ Build MacOS Frontend
        if: ${{ !inputs.skip_npm_install }}
        env:
          VITE_API_BASE_URL: https://mac.faizal.uk
          APP_URL: https://mac.faizal.uk
        run: npm run build

      - name: 📤 Upload Build Artifacts
        if: ${{ !inputs.skip_npm_install }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-frontend-dist
          path: dist/
          retention-days: 1

  deploy-production:
    name: 🚀 Deploy to Production VM
    needs: [pre-flight-check]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Auto-Bump Version & Git Tag
        if: ${{ inputs.bump_version != 'none' && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          npm version ${{ inputs.bump_version }} --force -m "chore(release): %s"
          git push origin main --follow-tags
          echo "✅ Version bumped to $(node -p "require('./package.json').version") and tag pushed!"

      - name: 📥 Download Frontend Artifacts
        if: ${{ !inputs.skip_npm_install }}
        uses: actions/download-artifact@v4
        with:
          name: macos-frontend-dist
          path: dist/

      - name: 🔍 Check Secrets Configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
        run: |
          ERRORS=0
          [ -z "$SSH_HOST" ] && echo "❌ SSH_HOST is missing!" && ERRORS=$((ERRORS+1))
          [ -z "$SSH_USER" ] && echo "❌ SSH_USER is missing!" && ERRORS=$((ERRORS+1))
          [ -z "$SSH_KEY"  ] && echo "❌ SSH_KEY is missing!"  && ERRORS=$((ERRORS+1))
          [ $ERRORS -gt 0 ] && exit 1
          echo "✅ All deployment secrets present."

      - name: 🔌 Setup SSH & Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
          SSH_HOST_VM2: ${{ secrets.SSH_HOST_VM2 }}
          SSH_USER_VM2: ${{ secrets.SSH_USER_VM2 }}
          SSH_KEY_VM2:  ${{ secrets.SSH_KEY_VM2 }}
          DRY_RUN:  ${{ inputs.dry_run }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # 1. Setup Primary VM Key
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          # 2. Setup Secondary VM Key (re-uses deploy_key if SSH_KEY_VM2 not set)
          if [ -n "$SSH_KEY_VM2" ]; then
            if echo "$SSH_KEY_VM2" | grep -q "^LS0t"; then
              echo "$SSH_KEY_VM2" | base64 -d > ~/.ssh/deploy_key_vm2
            elif echo "$SSH_KEY_VM2" | grep -q "BEGIN"; then
              echo "$SSH_KEY_VM2" | tr -d '\r' > ~/.ssh/deploy_key_vm2
            else
              echo "$SSH_KEY_VM2" | base64 -d > ~/.ssh/deploy_key_vm2 2>/dev/null || echo "$SSH_KEY_VM2" > ~/.ssh/deploy_key_vm2
            fi
          else
            cp ~/.ssh/deploy_key ~/.ssh/deploy_key_vm2
          fi
          chmod 600 ~/.ssh/deploy_key_vm2

          SSH_HOST_VM2="${SSH_HOST_VM2:-129.154.32.125}"
          VM2_USER="${SSH_USER_VM2:-ubuntu}"
          TARGET_DIR="/home/ubuntu/MacOS-Production"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")

          cat <<SSHEOF > ~/.ssh/config
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ServerAliveInterval 30
            ServerAliveCountMax 20
          SSHEOF

          if [ -n "$SSH_HOST_VM2" ]; then
            cat <<SSHEOF >> ~/.ssh/config

          Host vm2
            HostName $SSH_HOST_VM2
            User $VM2_USER
            IdentityFile ~/.ssh/deploy_key_vm2
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ServerAliveInterval 30
            ServerAliveCountMax 20
          SSHEOF
          fi
          chmod 600 ~/.ssh/config

          # ──────────────────────────────────────────────────────────
          # 🚀 DEPLOY TO PRIMARY VM 1 (my-mac)
          # ──────────────────────────────────────────────────────────
          echo "======================================================"
          echo "🚀 Primary VM 1 Deployment: $SSH_USER@$SSH_HOST"
          echo "   Path : $TARGET_DIR"
          echo "   Time : $TIMESTAMP"
          echo "======================================================"

          echo "Step 1: Remote directory permissions and pre-deploy DB snapshot on VM 1..."
          ssh production "
            sudo chown -R \$(id -u):\$(id -g) $TARGET_DIR 2>/dev/null || true
            chmod -R u+rwX $TARGET_DIR 2>/dev/null || true
            mkdir -p $TARGET_DIR/database/backups \
                     $TARGET_DIR/storage/wallpapers/builtin \
                     $TARGET_DIR/storage/wallpapers/marketplace \
                     $TARGET_DIR/storage/wallpapers/custom \
                     $TARGET_DIR/storage/temp_uploads \
                     $TARGET_DIR/storage/android-updates/archive
            chmod -R 777 $TARGET_DIR/database $TARGET_DIR/storage 2>/dev/null || true
            chmod 666 $TARGET_DIR/database/*.db* 2>/dev/null || true
            if [ -f $TARGET_DIR/database/MacOS.db ] && [ -s $TARGET_DIR/database/MacOS.db ]; then
              cp $TARGET_DIR/database/MacOS.db $TARGET_DIR/database/backups/MacOS_backup_${TIMESTAMP}.db 2>/dev/null || true
              echo 'DB pre-deploy snapshot taken'
            else
              echo 'WARNING: No database file found. DB is Docker-volume managed. Safe to continue.'
            fi
          "

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN complete — no production files modified."
            exit 0
          fi

          echo "📦 Step 2: Syncing files to Primary VM 1..."
          rsync -avz --delete \
            --no-owner --no-group --omit-dir-times \
            --exclude='/database/*.db*' \
            --exclude='/database/backups' \
            --exclude='/backups' \
            --exclude='/backend/uploads' \
            --exclude='/CloudStorage' \
            --exclude='/Wallpapers' \
            --exclude='/storage/wallpapers/custom' \
            --exclude='/storage/temp_uploads' \
            --exclude='/storage/android-updates' \
            --exclude='/logs' \
            --exclude='/tmp' \
            --exclude='/.env*' \
            --exclude='/.git' \
            --exclude='.git' \
            --exclude='/android' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='/node_modules' \
            --exclude='/zentra-analytics-dashboard/node_modules' \
            --exclude='/zentra-analytics-dashboard/dist' \
            ./ production:"$TARGET_DIR/"

          echo "🔄 Step 3: Fast Zero-Downtime Blue-Green Docker deployment on VM 1..."
          ssh production "
            set -e
            cd $TARGET_DIR
            chmod +x deploy/ubuntu/deploy-docker.sh
            ./deploy/ubuntu/deploy-docker.sh
            echo '======================================================'
            echo '🎉 Primary VM 1 — Deployment Complete!'
            echo '======================================================'
          "

          # ──────────────────────────────────────────────────────────
          # 🚀 DEPLOY TO SECONDARY VM 2 (cos) [Optional / Auto]
          # ──────────────────────────────────────────────────────────
          if [ -n "$SSH_HOST_VM2" ]; then
            echo ""
            echo "======================================================"
            echo "🚀 Secondary VM 2 Deployment: $VM2_USER@$SSH_HOST_VM2"
            echo "   Path : $TARGET_DIR"
            echo "   Time : $(date +'%Y%m%d_%H%M%S')"
            echo "======================================================"

            echo "Step 1: Remote directory setup on VM 2..."
            ssh vm2 "
              sudo chown -R \$(id -u):\$(id -g) $TARGET_DIR 2>/dev/null || true
              chmod -R u+rwX $TARGET_DIR 2>/dev/null || true
              mkdir -p $TARGET_DIR/database/backups \
                       $TARGET_DIR/storage/wallpapers/builtin \
                       $TARGET_DIR/storage/wallpapers/marketplace \
                       $TARGET_DIR/storage/wallpapers/custom \
                       $TARGET_DIR/storage/temp_uploads \
                       $TARGET_DIR/storage/android-updates/archive \
                       $TARGET_DIR/logs \
                       $TARGET_DIR/Wallpapers \
                       $TARGET_DIR/CloudStorage
              chmod -R 777 $TARGET_DIR/database $TARGET_DIR/storage 2>/dev/null || true
              chmod 666 $TARGET_DIR/database/*.db* 2>/dev/null || true
              if [ -f $TARGET_DIR/database/MacOS.db ] && [ -s $TARGET_DIR/database/MacOS.db ]; then
                cp $TARGET_DIR/database/MacOS.db $TARGET_DIR/database/backups/MacOS_backup_${TIMESTAMP}.db 2>/dev/null || true
              fi
            "

            echo "📦 Step 2: Syncing files to Secondary VM 2..."
            rsync -avz --delete \
              --no-owner --no-group --omit-dir-times \
              --exclude='/database/*.db*' \
              --exclude='/database/backups' \
              --exclude='/backups' \
              --exclude='/backend/uploads' \
              --exclude='/CloudStorage' \
              --exclude='/Wallpapers' \
              --exclude='/storage/wallpapers/custom' \
              --exclude='/storage/temp_uploads' \
              --exclude='/storage/android-updates' \
              --exclude='/logs' \
              --exclude='/tmp' \
              --exclude='/.env*' \
              --exclude='/.git' \
              --exclude='.git' \
              --exclude='/android' \
              --exclude='node_modules' \
              --exclude='**/node_modules' \
              --exclude='/node_modules' \
              --exclude='/zentra-analytics-dashboard/node_modules' \
              --exclude='/zentra-analytics-dashboard/dist' \
              ./ vm2:"$TARGET_DIR/"

            echo "🔄 Step 3: Fast Zero-Downtime Blue-Green Docker deployment on VM 2..."
            ssh vm2 "
              set -e
              cd $TARGET_DIR
              chmod +x deploy/ubuntu/deploy-docker.sh
              ./deploy/ubuntu/deploy-docker.sh
              echo '======================================================'
              echo '🎉 Secondary VM 2 — Deployment Complete!'
              echo '======================================================'
            "

            echo "Verifying VM 2 health..."
            ssh vm2 "curl -f -s -m 5 http://127.0.0.1:3001/api/health >/dev/null || curl -f -s -m 5 http://127.0.0.1:3004/api/health >/dev/null" && echo "✅ VM 2 is live and healthy!"
          else
            echo "ℹ️ SSH_HOST_VM2 secret not configured. Skipping Secondary VM deployment."
          fi

      - name: ✅ Smoke Test — mac.faizal.uk
        run: |
          echo "⏳ Verifying live production endpoint..."
          SUCCESS=false
          for i in $(seq 1 15); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "https://mac.faizal.uk/api/health" || echo "000")
            if [ "$HTTP" = "200" ]; then
              SUCCESS=true
              echo "✅ mac.faizal.uk is live and healthy (HTTP 200 after ${i}s)!"
              break
            fi
            sleep 1
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Smoke test FAILED after 15s (last HTTP: $HTTP)"
            exit 1
          fi
