name: 🚀 1-Click Deploy to Ubuntu

on:
  workflow_dispatch:
    inputs:
      bump_version:
        description: 'Auto-bump version before deploy?'
        required: true
        type: choice
        options:
          - 'none'
          - 'patch'
          - 'minor'
        default: 'none'
      dry_run:
        description: 'Dry Run (test connection & backup without changing live server)'
        required: true
        type: boolean
        default: false
      skip_npm_install:
        description: 'Skip npm install (faster deploy if no packages changed)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pre-flight-check:
    name: 🛡️ Pre-Flight Verification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install & Build Client
        run: |
          npm ci
          npm run build

      - name: 🔍 Syntax Validation
        run: |
          node --check backend/main/macos-api-server.js
          node --check server-prod.js
          node --check tools/healthcheck.mjs

  deploy-production:
    name: 🚀 Deploy to Production VM
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Auto-Bump Version & Git Tag
        if: github.event.inputs.bump_version != 'none' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.bump_version }} -m "chore(release): %s"
          git push origin main --follow-tags
          echo "✅ Version bumped to $(node -p "require('./package.json').version") and tag pushed!"

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install & Build Frontend
        run: |
          npm ci
          npm run build
          node --check backend/main/macos-api-server.js
          node --check server-prod.js

      - name: 🔍 Check Secrets Configuration
        run: |
          echo "Verifying deployment secrets..."
          ERRORS=0
          if [ -z "$SSH_HOST" ]; then
            echo "❌ ERROR: 'SSH_HOST' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ ERROR: 'SSH_USER' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: 'SSH_KEY' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: 🔌 Setup SSH & Deploy to Ubuntu
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SKIP_NPM: ${{ github.event.inputs.skip_npm_install }}
        run: |
          # 1. Setup SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode Base64 or raw key
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/MacOS-Production"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")

          echo "======================================================"
          echo "🚀 1-Click Deployment Triggered"
          echo "Target: $SSH_USER@$SSH_HOST:$TARGET_DIR"
          echo "Timestamp: $TIMESTAMP"
          echo "======================================================"

          # 2. Automated Remote Database Snapshot
          echo "🛡️ Step 1: Taking remote SQLite safety snapshot..."
          ssh production "mkdir -p $TARGET_DIR/database/backups && if [ -f $TARGET_DIR/database/MacOS.db ]; then cp $TARGET_DIR/database/MacOS.db $TARGET_DIR/database/backups/MacOS_backup_${TIMESTAMP}.db && echo '✅ Database safely backed up to database/backups/MacOS_backup_${TIMESTAMP}.db'; else echo '⚠️ No existing database file found to backup.'; fi"

          # 3. Check Dry Run
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN: Pre-flight checks, build, and remote backup verified successfully."
            echo "No production files were modified."
            exit 0
          fi

          # 4. Sync files via rsync (safe sync: excludes database, uploads, wallpapers, logs, .env)
          echo "📦 Step 2: Syncing build & source files to VM via rsync..."
          rsync -avz --delete \
            --exclude='database/*.db*' \
            --exclude='database/backups' \
            --exclude='backend/uploads' \
            --exclude='CloudStorage' \
            --exclude='Wallpapers' \
            --exclude='logs' \
            --exclude='tmp' \
            --exclude='.env*' \
            --exclude='.git' \
            --exclude='android' \
            --exclude='node_modules' \
            ./ production:"$TARGET_DIR/"

          # 5. Remote post-sync actions (npm install, PM2 reload, health check)
          echo "🔄 Step 3: Executing remote reload..."
          ssh production bash -s << 'REMOTESCRIPT'
          set -e
          TARGET_DIR="/home/ubuntu/MacOS-Production"
          cd "$TARGET_DIR"

          if [ "$SKIP_NPM" != "true" ]; then
            echo "📦 Checking production dependencies..."
            npm ci --omit=dev || npm install --omit=dev
          fi

          echo "🔄 Reloading PM2 services with zero downtime..."
          pm2 reload ecosystem.config.js --env oraclevm --only backend,frontend --update-env || pm2 restart ecosystem.config.js --env oraclevm --only backend,frontend --update-env

          echo "🏥 Verifying server health..."
          sleep 4
          HEALTH_URL="http://127.0.0.1:3001/api/health"
          ALT_HEALTH_URL="http://127.0.0.1:3000/api/health"

          if curl -s -f -m 5 "$HEALTH_URL" > /dev/null 2>&1; then
            echo "✅ Health check passed on :3001"
          elif curl -s -f -m 5 "$ALT_HEALTH_URL" > /dev/null 2>&1; then
            echo "✅ Health check passed on :3000"
          else
            echo "⚠️ Health check warning: PM2 process status:"
            pm2 status
          fi

          echo "======================================================"
          echo "🎉 1-Click Deployment Complete & Production Live!"
          echo "======================================================"
          REMOTESCRIPT
