# ⚠️  DEPRECATED — Use the new split workflows instead:
#
#   deploy-backend.yml → Backend + MacOS Frontend (auto-triggers on push)
#   deploy-zentra.yml  → Zentra Dashboard only   (auto-triggers on push)
#   deploy-all.yml     → Full-stack manual deploy (all components at once)
#   android-deploy.yml → Android APK release      (unchanged)
#
# This file is kept only for historical reference and will be removed
# in a future cleanup. Do not trigger it manually.

name: ⚠️ [DEPRECATED] 1-Click Deploy (use deploy-backend / deploy-zentra / deploy-all)

on:
  workflow_dispatch:
    inputs:
      target_site:
        description: '[DEPRECATED] Use deploy-backend.yml or deploy-all.yml instead'
        required: true
        type: choice
        options:
          - 'macos'
          - 'erp'
        default: 'macos'
      bump_version:
        description: 'Auto-bump version before deploy?'
        required: true
        type: choice
        options:
          - 'none'
          - 'patch'
          - 'minor'
        default: 'none'
      dry_run:
        description: 'Dry Run (test connection & backup without changing live server)'
        required: true
        type: boolean
        default: false
      skip_npm_install:
        description: 'Skip npm install (faster deploy if no packages changed)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pre-flight-check:
    name: 🛡️ Pre-Flight Verification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install & Build Client
        env:
          TARGET_SITE: ${{ github.event.inputs.target_site || 'macos' }}
          APP_URL: ${{ github.event.inputs.target_site == 'erp' && 'https://erp.faizal.uk' || 'https://mac.faizal.uk' }}
          VITE_API_BASE_URL: ${{ github.event.inputs.target_site == 'erp' && 'https://erp.faizal.uk' || 'https://mac.faizal.uk' }}
        run: |
          npm ci
          npm run build
          if [ "$TARGET_SITE" = "erp" ]; then
            echo "VITE_API_BASE_URL=https://erp.faizal.uk" > zentra-analytics-dashboard/.env.production
            echo "APP_URL=https://erp.faizal.uk" >> zentra-analytics-dashboard/.env.production
            npm --prefix zentra-analytics-dashboard ci
            npm --prefix zentra-analytics-dashboard run build
          else
            echo "VITE_API_BASE_URL=https://mac.faizal.uk" > zentra-analytics-dashboard/.env.production
            echo "APP_URL=https://mac.faizal.uk" >> zentra-analytics-dashboard/.env.production
            npm --prefix zentra-analytics-dashboard ci
            npm --prefix zentra-analytics-dashboard run build
          fi

      - name: 🔍 Syntax Validation
        run: |
          node --check backend/main/macos-api-server.js
          node --check server-prod.js
          node --check tools/healthcheck.mjs

  deploy-production:
    name: 🚀 Deploy to Production VM
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Auto-Bump Version & Git Tag
        if: github.event.inputs.bump_version != 'none' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          npm version ${{ github.event.inputs.bump_version }} --force -m "chore(release): %s"
          git push origin main --follow-tags
          echo "✅ Version bumped to $(node -p "require('./package.json').version") and tag pushed!"

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install & Build Frontend
        env:
          TARGET_SITE: ${{ github.event.inputs.target_site || 'macos' }}
          APP_URL: ${{ github.event.inputs.target_site == 'erp' && 'https://erp.faizal.uk' || 'https://mac.faizal.uk' }}
          VITE_API_BASE_URL: ${{ github.event.inputs.target_site == 'erp' && 'https://erp.faizal.uk' || 'https://mac.faizal.uk' }}
        run: |
          npm ci
          npm run build
          if [ "$TARGET_SITE" = "erp" ]; then
            echo "VITE_API_BASE_URL=https://erp.faizal.uk" > zentra-analytics-dashboard/.env.production
            echo "APP_URL=https://erp.faizal.uk" >> zentra-analytics-dashboard/.env.production
            npm --prefix zentra-analytics-dashboard ci
            npm --prefix zentra-analytics-dashboard run build
          else
            echo "VITE_API_BASE_URL=https://mac.faizal.uk" > zentra-analytics-dashboard/.env.production
            echo "APP_URL=https://mac.faizal.uk" >> zentra-analytics-dashboard/.env.production
            npm --prefix zentra-analytics-dashboard ci
            npm --prefix zentra-analytics-dashboard run build
          fi
          node --check backend/main/macos-api-server.js
          node --check server-prod.js

      - name: 🔍 Check Secrets Configuration
        run: |
          echo "Verifying deployment secrets..."
          ERRORS=0
          if [ -z "$SSH_HOST" ]; then
            echo "❌ ERROR: 'SSH_HOST' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_USER" ]; then
            echo "❌ ERROR: 'SSH_USER' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: 'SSH_KEY' is missing in GitHub Secrets!"
            ERRORS=$((ERRORS + 1))
          fi
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: 🔌 Setup SSH & Deploy to Ubuntu
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SKIP_NPM: ${{ github.event.inputs.skip_npm_install }}
          TARGET_SITE: ${{ github.event.inputs.target_site || 'macos' }}
        run: |
          # 1. Setup SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode Base64 or raw key
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          elif echo "$SSH_KEY" | grep -q "BEGIN"; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          cat << 'EOF' > ~/.ssh/config
          Host production
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            Port 22
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedKeyTypes +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            HostkeyAlgorithms +ssh-rsa,rsa-sha2-256,rsa-sha2-512
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

          TARGET_DIR="/home/ubuntu/MacOS-Production"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")

          echo "======================================================"
          echo "🚀 1-Click Deployment Triggered"
          echo "Target Site: $TARGET_SITE"
          echo "Deploy Host: $SSH_USER@$SSH_HOST:$TARGET_DIR"
          echo "Timestamp: $TIMESTAMP"
          echo "======================================================"

          # 2. Automated Remote Database Snapshot & Directory Permissions
          echo "🛡️ Step 1: Taking remote SQLite safety snapshot, cleaning build cache & ensuring directory permissions..."
          ssh production "docker builder prune -f --keep-storage 1000MB 2>/dev/null || true && docker container prune -f 2>/dev/null || true && mkdir -p $TARGET_DIR/database/backups $TARGET_DIR/storage/wallpapers/builtin $TARGET_DIR/storage/wallpapers/marketplace $TARGET_DIR/storage/wallpapers/custom $TARGET_DIR/storage/temp_uploads $TARGET_DIR/storage/android-updates/archive && chmod -R 777 $TARGET_DIR/storage 2>/dev/null || true && if [ -f $TARGET_DIR/database/MacOS.db ]; then cp $TARGET_DIR/database/MacOS.db $TARGET_DIR/database/backups/MacOS_backup_${TIMESTAMP}.db && echo '✅ Database safely backed up to database/backups/MacOS_backup_${TIMESTAMP}.db'; else echo '⚠️ No existing database file found to backup.'; fi"

          # 3. Check Dry Run
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN: Pre-flight checks, build, and remote backup verified successfully."
            echo "No production files were modified."
            exit 0
          fi

          # 4. Sync files via rsync (safe sync: excludes database, uploads, wallpapers, logs, .env)
          echo "📦 Step 2: Syncing build & source files to VM via rsync..."
          rsync -avz --delete \
            --exclude='/database/*.db*' \
            --exclude='/database/backups' \
            --exclude='/backups' \
            --exclude='/backend/uploads' \
            --exclude='/CloudStorage' \
            --exclude='/Wallpapers' \
            --exclude='/storage/wallpapers/custom' \
            --exclude='/storage/temp_uploads' \
            --exclude='/storage/android-updates' \
            --exclude='/logs' \
            --exclude='/tmp' \
            --exclude='/.env*' \
            --exclude='/.git' \
            --exclude='/android' \
            --exclude='/node_modules' \
            ./ production:"$TARGET_DIR/"

          # 5. Remote preflight: clear stale blue/green port locks before Docker starts
          echo "🩹 Step 2.5: Checking for stale binds before blue/green deployment..."
          ssh production bash -s << 'REMOTE_PREFLIGHT'
          set -e

          check_port_health() {
            local port="$1"
            curl -fsS "http://127.0.0.1:${port}/api/health" >/dev/null 2>&1
          }

          for port in 3001 3004; do
            if ss -lnt 2>/dev/null | awk '{print $4}' | grep -Eq "127\\.0\\.0\\.1:${port}$|\\[::\\]:${port}$|0\\.0\\.0\\.0:${port}$"; then
              echo "Port ${port} is currently occupied. Checking whether it is a healthy live app before doing any cleanup..."
              if check_port_health "$port"; then
                echo "Port ${port} is already serving a healthy app; leaving it alone to avoid unnecessary downtime."
                continue
              fi

              echo "Port ${port} is occupied but unhealthy. Cleaning stale Docker slot containers to avoid the GitHub Action bind failure."
              docker rm -f macos-server-blue macos-server-green 2>/dev/null || true
              sleep 2
              break
            fi
          done

          if ss -lnt 2>/dev/null | awk '{print $4}' | grep -Eq "127\\.0\\.0\\.1:3004$|\\[::\\]:3004$|0\\.0\\.0\\.0:3004$"; then
            if check_port_health 3004; then
              echo "INFO: port 3004 is healthy and still active. Deployment will continue without removing the live slot."
            else
              echo "ERROR: port 3004 is still occupied after cleanup and is not healthy. Another live process is holding the green slot."
              ss -lntp | grep ':3004 ' || true
              exit 1
            fi
          fi
          REMOTE_PREFLIGHT

          # 6. Remote post-sync actions (Docker Blue-Green deployment with verification)
          echo "🔄 Step 3: Executing Blue-Green zero-downtime Docker deployment..."
          ssh production bash -s << 'REMOTESCRIPT'
          set -e
          TARGET_DIR="/home/ubuntu/MacOS-Production"
          cd "$TARGET_DIR"

          chmod +x deploy/ubuntu/deploy-docker.sh
          ./deploy/ubuntu/deploy-docker.sh

          echo "======================================================"
          echo "🎉 1-Click Docker Deployment Complete & Production Live!"
          echo "======================================================"
          REMOTESCRIPT
